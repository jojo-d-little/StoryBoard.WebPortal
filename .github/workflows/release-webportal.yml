name: Release WebPortal

on:
  push:
    tags:
      - 'webportal-v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: Storyboard.WebPortal/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        working-directory: Storyboard.WebPortal
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Validate contracts, tests, and build
        working-directory: Storyboard.WebPortal
        run: |
          npm run verify:contracts
          npm test
          npm run build

      - name: Package runtime artifact
        id: package
        working-directory: Storyboard.WebPortal
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').packages[''].version")
          release_tag="$GITHUB_REF_NAME"

          if [ "$package_version" != "$lock_version" ]; then
            echo "package.json version $package_version does not match package-lock.json version $lock_version."
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid WebPortal package version: $package_version."
            exit 1
          fi

          if [ "$release_tag" != "webportal-v$package_version" ]; then
            echo "Release tag $release_tag does not match package version $package_version."
            exit 1
          fi

          archive="storyboard-webportal-${package_version}.tar.gz"
          tar -czf "$archive" -C dist .
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Pack WebPortal NuGet package
        id: nuget
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          rm -rf artifacts/packages/nuget
          mkdir -p artifacts/packages/nuget
          dotnet pack Storyboard.WebPortal.Package/Storyboard.WebPortal.Package.csproj \
            --configuration Release \
            --output artifacts/packages/nuget \
            -p:Version="$VERSION" \
            --nologo
          package="artifacts/packages/nuget/Storyboard.WebPortal.${VERSION}.nupkg"
          test -f "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Publish WebPortal NuGet package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.nuget.outputs.package }}
        run: |
          dotnet nuget push "$PACKAGE" \
            --source https://nuget.pkg.github.com/jojo-d-little/index.json \
            --api-key "$GH_TOKEN" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "webportal-v$VERSION" \
            "Storyboard.WebPortal/$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "WebPortal $VERSION" \
            --generate-notes
