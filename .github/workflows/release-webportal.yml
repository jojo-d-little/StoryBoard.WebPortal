name: Release WebPortal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to publish the current WebPortal version"
        required: true
        default: ""
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: Storyboard.WebPortal/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        working-directory: Storyboard.WebPortal
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

      - name: Validate contracts, tests, and build
        working-directory: Storyboard.WebPortal
        run: |
          npm run verify:contracts
          npm test
          npm run build

      - name: Package runtime artifact
        id: package
        working-directory: Storyboard.WebPortal
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').packages[''].version")
          latest_tag=$(git tag --list 'webportal-v*' --sort=-version:refname | head -n 1)

          if [ "$package_version" != "$lock_version" ]; then
            echo "package.json version $package_version does not match package-lock.json version $lock_version."
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid WebPortal package version: $package_version."
            exit 1
          fi

          if [ -n "$latest_tag" ] && [ "$package_version" = "${latest_tag#webportal-v}" ]; then
            echo "Version $package_version has already been released. Bump package.json and package-lock.json first."
            exit 1
          fi

          archive="storyboard-webportal-${package_version}.tar.gz"
          tar -czf "$archive" -C dist .
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "webportal-v$VERSION" \
            "Storyboard.WebPortal/$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "WebPortal $VERSION" \
            --generate-notes
